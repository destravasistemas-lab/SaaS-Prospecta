name: Importar base de CNPJ

# Baixa os dados abertos da Receita Federal e atualiza a base da Prospecção.
# Precisa do secret CNPJ_DATABASE_URL (URL externa do Postgres do Render) e,
# opcionalmente, da variável CNPJ_UFS (ex.: PB,PE,RN).

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "Estados separados por vírgula (ex.: PB,PE,RN)"
        required: false
      month:
        description: "Mês da Receita AAAA-MM (vazio = o mais recente)"
        required: false
  schedule:
    - cron: "0 6 20 * *"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "asyncpg>=0.30,<1" "httpx>=0.28,<1"
      - name: Importar
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.CNPJ_DATABASE_URL }}
          UFS: ${{ inputs.ufs || vars.CNPJ_UFS || 'PB' }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            python scripts/import_cnpj.py --ufs "$UFS" --month "$MONTH"
          else
            python scripts/import_cnpj.py --ufs "$UFS"
          fi
